name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /var/www/onesubmit
          
          # 1. Reset Kode ke Versi GitHub Terbaru (Anti Konflik)
          git reset --hard
          git pull origin main
          
          # 2. Infrastructure as Code: Pastikan folder vital SELALU ada
          # Robot akan membuatnya otomatis jika hilang/terhapus
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          
          # 3. Maintenance Permission (Menjaga agar tetap 775 - Aman)
          # Karena robot login sebagai 'andree' (pemilik), dia bisa menjalankan chmod ini
          chmod -R 775 storage bootstrap/cache
          
          # 4. Standard Deployment Laravel
          composer install --no-dev --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          
          # 5. Link Storage & Restart Queue
          php artisan storage:link || true
          php artisan queue:restart